<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Offscreen layers
const posterC = document.createElement('canvas'); posterC.width = W; posterC.height = H;
const pctx = posterC.getContext('2d');
const seaC = document.createElement('canvas'); seaC.width = W; seaC.height = H;
const sctx = seaC.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ---------- static random data ----------
const R = rng(7);
const sparkles = [];
// big feature sparkles like the poster (top-right cluster, left side, bottom-right)
const feature = [
  [880, 300, 70], [960, 430, 26], [800, 210, 22], [140, 360, 34], [90, 520, 18],
  [990, 1420, 40], [930, 1500, 18], [150, 1500, 30], [960, 800, 16], [200, 1180, 14]
];
for (const [x, y, s] of feature) sparkles.push({ x, y, s, ph: R() * 6.28, sp: 1.2 + R() * 1.5 });
for (let i = 0; i < 70; i++) sparkles.push({ x: R() * W, y: R() * H, s: 2 + R() * 7, ph: R() * 6.28, sp: 1 + R() * 3 });

const skyStars = [];
for (let i = 0; i < 140; i++) skyStars.push({ x: R() * W, y: R() * 860, r: .6 + R() * 1.8, ph: R() * 6.28, sp: 1 + R() * 3 });

const drifters = [];
for (let i = 0; i < 46; i++) {
  const src = sparkles[Math.floor(R() * sparkles.length)];
  drifters.push({ x0: R() * W, y0: 300 + R() * 1300, s: 3 + R() * 10, vx: (R() - .5) * 120, vy: -(120 + R() * 260),
                  sway: 20 + R() * 40, ph: R() * 6.28, delay: R() * .9 });
}

// ---------- drawing primitives ----------
function star4(c, x, y, s, a) {
  if (a <= 0 || s <= 0) return;
  c.save();
  c.globalAlpha = a;
  c.translate(x, y);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, s * 1.6);
  g.addColorStop(0, 'rgba(210,245,255,0.55)');
  g.addColorStop(1, 'rgba(160,220,255,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, s * 1.6, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(225,248,255,0.95)';
  c.beginPath();
  const k = s * 0.16;
  c.moveTo(0, -s);
  c.quadraticCurveTo(k, -k, s, 0);
  c.quadraticCurveTo(k, k, 0, s);
  c.quadraticCurveTo(-k, k, -s, 0);
  c.quadraticCurveTo(-k, -k, 0, -s);
  c.fill();
  c.restore();
}

function posterBackground(c, t) {
  // deep night-blue gradient
  const g = c.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, '#0d1f4f');
  g.addColorStop(0.45, '#17407a');
  g.addColorStop(1, '#0c2253');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // soft aurora-like diagonal light bands
  c.save();
  c.globalCompositeOperation = 'lighter';
  const bands = [
    { x: 380, y: 520, r: 900, col: 'rgba(80,190,210,0.16)', dx: 40, f: .35 },
    { x: 900, y: 1250, r: 800, col: 'rgba(90,150,230,0.14)', dx: -50, f: .28 },
    { x: 150, y: 1700, r: 700, col: 'rgba(70,170,200,0.10)', dx: 30, f: .4 },
  ];
  for (const b of bands) {
    c.save();
    c.translate(b.x + Math.sin(t * b.f) * b.dx, b.y);
    c.rotate(-0.6);
    c.scale(1, 0.35);
    const rg = c.createRadialGradient(0, 0, 0, 0, 0, b.r);
    rg.addColorStop(0, b.col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = rg;
    c.beginPath(); c.arc(0, 0, b.r, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.restore();

  // vignette
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(2,6,20,0.55)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}

function posterSparkles(c, t, alpha = 1) {
  for (const s of sparkles) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
    star4(c, s.x, s.y, s.s * (0.85 + 0.15 * tw), alpha * tw);
  }
}

function arcText(c, text, cx, cy, radius, centerAngle, font) {
  c.font = font;
  const widths = [...text].map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (text.length - 1) * 2;
  let ang = centerAngle - (total / radius) / 2;
  for (let i = 0; i < text.length; i++) {
    const w = widths[i];
    const a = ang + (w / 2) / radius;
    c.save();
    c.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    c.rotate(a + Math.PI / 2);
    c.fillText(text[i], -w / 2, 0);
    c.restore();
    ang += (w + 2) / radius;
  }
}

// Title: "Storytelling" (arched) + "Palestine" (big flowing script)
function drawTitle(c, cx, cy, scale, glow, alpha = 1) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha = alpha;
  c.translate(cx, cy);
  c.scale(scale, scale);
  c.textBaseline = 'alphabetic';

  // Palestine
  let size = 300;
  c.font = `700 ${size}px "Dancing Script"`;
  let w = c.measureText('Palestine').width;
  if (w > 940) { size *= 940 / w; c.font = `700 ${size}px "Dancing Script"`; w = c.measureText('Palestine').width; }

  const drawP = () => c.fillText('Palestine', -w / 2, size * 0.32);
  // glow passes
  c.fillStyle = 'rgba(235,252,255,1)';
  c.shadowColor = `rgba(150,225,255,${0.55 + 0.45 * glow})`;
  c.shadowBlur = 30 + 60 * glow; drawP();
  c.shadowBlur = 12 + 18 * glow; drawP();
  c.shadowBlur = 0; drawP();

  // Storytelling (arched, upper-left like the poster)
  c.fillStyle = 'rgba(235,252,255,1)';
  c.shadowColor = `rgba(150,225,255,${0.5 + 0.4 * glow})`;
  c.shadowBlur = 14 + 16 * glow;
  arcText(c, 'Storytelling', -w * 0.13, size * 0.30, size * 1.05, -Math.PI / 2 - 0.10, `600 ${size * 0.30}px "Dancing Script"`);
  c.restore();
}

function centerText(c, text, y, font, color, alpha, dy = 0, blur = 0, glow = 0) {
  if (alpha <= 0) return;
  c.save();
  c.globalAlpha = alpha;
  c.font = font;
  c.fillStyle = color;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  if (blur > 0.2) c.filter = `blur(${blur}px)`;
  if (glow > 0) { c.shadowColor = 'rgba(140,220,255,0.6)'; c.shadowBlur = glow; }
  c.fillText(text, W / 2, y + dy);
  c.restore();
}

// ---------- POSTER LAYER ----------
// mode: 'hook' (big centered title) | 'info' (title up, info lines)
function renderPoster(c, t, mode, local) {
  posterBackground(c, t);
  posterSparkles(c, t);

  if (mode === 'hook') {
    // light pulse on the title synced with the opening sound accent
    const pulse = Math.exp(-Math.pow((t - 0.35) / 0.28, 2)) + 0.25 * (0.5 + 0.5 * Math.sin(t * 2.4));
    drawTitle(c, W / 2, 860, 1.0, clamp(pulse), 1);

    const a = easeOut(seg(t, 0.9, 1.6));
    centerText(c, 'ZUKUNFT VERÄNDERN HEISST', 1150, '600 40px Montserrat', 'rgba(220,240,255,0.95)', a, (1 - a) * 18, 0);
    centerText(c, 'GESCHICHTE VERSTEHEN', 1210, '600 40px Montserrat', 'rgba(220,240,255,0.95)', a, (1 - a) * 18, 0);
    const a2 = easeOut(seg(t, 1.4, 2.1));
    centerText(c, 'Eine Reise durch die Geschichte von al-Quds', 1300, '500 32px Montserrat', 'rgba(170,215,240,0.9)', a2, (1 - a2) * 14, 0);
  } else {
    const glow = 0.35 + 0.15 * Math.sin(t * 2.0);
    drawTitle(c, W / 2, 560, 0.78, glow, 1);

    // thin divider
    const dA = easeOut(seg(local, 0.15, 0.6));
    c.save();
    c.globalAlpha = dA * 0.7;
    const lg = c.createLinearGradient(W / 2 - 260, 0, W / 2 + 260, 0);
    lg.addColorStop(0, 'rgba(160,225,255,0)'); lg.addColorStop(0.5, 'rgba(180,235,255,1)'); lg.addColorStop(1, 'rgba(160,225,255,0)');
    c.fillStyle = lg; c.fillRect(W / 2 - 260 * dA, 820, 520 * dA, 2);
    c.restore();

    const lines = [
      { txt: 'Samstag, 14.11.2026',          y: 930,  font: '700 72px Montserrat', col: '#ffffff', at: 0.35 },
      { txt: 'Einlass 13:00 · Beginn 13:30', y: 1040, font: '600 56px Montserrat', col: '#e4f2ff', at: 0.95 },
      { txt: 'Mannheim · Nähe Wasserturm',   y: 1135, font: '600 56px Montserrat', col: '#e4f2ff', at: 1.55 },
      { txt: 'Tickets: Link in Instagram-Bio', y: 1280, font: '700 52px Montserrat', col: '#ffffff', at: 2.15, box: true },
      { txt: 'Nur begrenzte Plätze!',        y: 1415, font: '700 62px Montserrat', col: '#a9eef2', at: 2.6, glow: 18 },
    ];
    for (const L of lines) {
      const p = easeOut(seg(local, L.at, L.at + 0.45));
      if (p <= 0) continue;
      if (L.box) {
        c.save();
        c.globalAlpha = p;
        c.font = L.font;
        const bw = c.measureText(L.txt).width + 80, bh = 104;
        const bx = W / 2 - bw / 2, by = L.y - bh / 2 + (1 - p) * 24;
        c.fillStyle = 'rgba(120,200,215,0.20)';
        c.strokeStyle = 'rgba(170,235,245,0.75)';
        c.lineWidth = 2;
        roundRect(c, bx, by, bw, bh, 18); c.fill(); c.stroke();
        c.restore();
      }
      // gentle pulse on the last line during the hold
      let extraGlow = L.glow || 0;
      if (L.glow) extraGlow += 14 * (0.5 + 0.5 * Math.sin((local - 3.2) * 5)) * seg(local, 3.0, 3.2);
      centerText(c, L.txt, L.y, L.font, L.col, p, (1 - p) * 24, (1 - p) * 8, extraGlow);
    }
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// ---------- SEA LAYER ----------
const HORIZON = 900;
const MOON = { x: 700, y: 430, r: 62 };

function renderSea(c, t) {
  // sky at dusk -> night
  const sky = c.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#040b22');
  sky.addColorStop(0.55, '#0e2353');
  sky.addColorStop(0.88, '#23457f');
  sky.addColorStop(1, '#3a5e93');
  c.fillStyle = sky; c.fillRect(0, 0, W, HORIZON + 2);

  // faint dusk afterglow near the horizon
  c.save();
  c.globalCompositeOperation = 'lighter';
  const dg = c.createRadialGradient(260, HORIZON, 0, 260, HORIZON, 700);
  dg.addColorStop(0, 'rgba(150,120,190,0.22)');
  dg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = dg; c.fillRect(0, 0, W, HORIZON);
  c.restore();

  // stars
  for (const s of skyStars) {
    const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * (1 - s.y / 1000);
    c.fillStyle = `rgba(220,240,255,${a})`;
    c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
  }

  // moon + halo
  c.save();
  const halo = c.createRadialGradient(MOON.x, MOON.y, MOON.r * 0.8, MOON.x, MOON.y, MOON.r * 6);
  halo.addColorStop(0, 'rgba(200,230,255,0.35)');
  halo.addColorStop(1, 'rgba(200,230,255,0)');
  c.fillStyle = halo; c.beginPath(); c.arc(MOON.x, MOON.y, MOON.r * 6, 0, Math.PI * 2); c.fill();
  const mg = c.createRadialGradient(MOON.x - 18, MOON.y - 18, 4, MOON.x, MOON.y, MOON.r);
  mg.addColorStop(0, '#fbfdff'); mg.addColorStop(1, '#d5e4f5');
  c.fillStyle = mg; c.shadowColor = 'rgba(210,235,255,0.9)'; c.shadowBlur = 40;
  c.beginPath(); c.arc(MOON.x, MOON.y, MOON.r, 0, Math.PI * 2); c.fill();
  c.restore();

  // sea body
  const sea = c.createLinearGradient(0, HORIZON, 0, H);
  sea.addColorStop(0, '#1d3a6c');
  sea.addColorStop(0.25, '#0f2550');
  sea.addColorStop(1, '#030a1f');
  c.fillStyle = sea; c.fillRect(0, HORIZON, W, H - HORIZON);

  // horizon haze
  const hz = c.createLinearGradient(0, HORIZON - 30, 0, HORIZON + 40);
  hz.addColorStop(0, 'rgba(120,160,210,0)');
  hz.addColorStop(0.5, 'rgba(140,180,225,0.35)');
  hz.addColorStop(1, 'rgba(120,160,210,0)');
  c.fillStyle = hz; c.fillRect(0, HORIZON - 30, W, 70);

  // waves: perspective rows of soft highlights
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {
    const d = i / 90;                         // 0 near horizon -> 1 near camera
    const y = HORIZON + 4 + Math.pow(d, 1.8) * (H - HORIZON);
    const amp = 1 + d * 9;
    const freq = 0.02 / (0.25 + d);
    const spd = 1.2 + d * 0.6;
    c.strokeStyle = `rgba(120,170,230,${0.05 + 0.08 * (1 - d)})`;
    c.lineWidth = 1 + d * 3;
    c.beginPath();
    for (let x = -20; x <= W + 20; x += 16) {
      const yy = y + Math.sin(x * freq + t * spd + i * 1.7) * amp + Math.sin(x * freq * 2.3 - t * spd * 0.7 + i) * amp * 0.4;
      x === -20 ? c.moveTo(x, yy) : c.lineTo(x, yy);
    }
    c.stroke();
  }

  // moonlight path: glinting dashes
  for (let i = 0; i < 160; i++) {
    const d = i / 160;
    const y = HORIZON + 3 + Math.pow(d, 1.7) * (H - HORIZON);
    const spread = 20 + d * 260;
    const n = 2 + Math.floor(d * 6);
    for (let k = 0; k < n; k++) {
      const seed = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
      const fr = seed - Math.floor(seed);
      const x = MOON.x + (fr - 0.5) * 2 * spread + Math.sin(t * 1.3 + i * 0.7 + k) * (4 + d * 14);
      const flick = 0.5 + 0.5 * Math.sin(t * (3 + fr * 4) + fr * 30 + i);
      const fall = 1 - Math.abs(fr - 0.5) * 1.6;
      const a = clamp(flick * fall) * (0.85 - d * 0.35);
      if (a <= 0.02) continue;
      const len = 6 + d * 46 * (0.5 + fr);
      c.fillStyle = `rgba(225,240,255,${a})`;
      c.fillRect(x - len / 2, y, len, 1 + d * 3);
    }
  }
  c.restore();

  // ship silhouette sailing slowly along the horizon
  const sx = lerp(250, 360, seg(t, 3, 6.2));
  const bob = Math.sin(t * 1.6) * 1.2;
  drawShip(c, sx, HORIZON - 2 + bob, 1.0);
}

function drawShip(c, x, y, s) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  c.fillStyle = 'rgba(240,248,255,0.95)';
  c.shadowColor = 'rgba(200,230,255,0.8)';
  c.shadowBlur = 10;
  // hull
  c.beginPath();
  c.moveTo(-34, -8); c.lineTo(34, -8); c.lineTo(26, 0); c.lineTo(-28, 0); c.closePath(); c.fill();
  // mast
  c.fillRect(-1.5, -62, 3, 54);
  // main sail
  c.beginPath(); c.moveTo(3, -60); c.quadraticCurveTo(24, -36, 28, -12); c.lineTo(3, -12); c.closePath(); c.fill();
  // fore sail
  c.beginPath(); c.moveTo(-3, -56); c.lineTo(-3, -12); c.lineTo(-26, -12); c.closePath(); c.fill();
  c.restore();
  // faint reflection
  c.save();
  c.globalAlpha = 0.18;
  c.fillStyle = '#e8f2ff';
  c.fillRect(x - 26, y + 4, 52, 3);
  c.fillRect(x - 14, y + 10, 30, 2);
  c.restore();
}

// ---------- drifting sparkles (poster -> sky) ----------
function renderDrifters(c, t) {
  const t0 = 3.5;
  if (t < t0 || t > 6.4) return;
  for (const d of drifters) {
    const lt = t - t0 - d.delay;
    if (lt < 0) continue;
    const life = 2.2;
    const p = lt / life;
    if (p > 1) continue;
    const x = d.x0 + d.vx * lt + Math.sin(lt * 2 + d.ph) * d.sway;
    const y = d.y0 + d.vy * lt;
    const a = Math.sin(Math.PI * clamp(p)) * 0.95;
    star4(c, x, y, d.s * (1 - 0.4 * p), a);
  }
}

// ---------- ripple compositor ----------
function drawRippled(dst, src, amp, t, scale, alpha) {
  dst.save();
  dst.globalAlpha = alpha;
  dst.translate(W / 2, H / 2);
  dst.scale(scale, scale);
  dst.translate(-W / 2, -H / 2);
  if (amp < 0.3) {
    dst.drawImage(src, 0, 0);
  } else {
    const strip = 4;
    for (let y = 0; y < H; y += strip) {
      const ox = Math.sin(y * 0.018 - t * 9) * amp + Math.sin(y * 0.047 + t * 5) * amp * 0.35;
      const oy = Math.cos(y * 0.011 - t * 6) * amp * 0.35;
      const sy = clamp(y + oy, 0, H - strip);
      dst.drawImage(src, 0, sy, W, strip, ox, y, W, strip + 0.6);
    }
  }
  dst.restore();
}

// ---------- master timeline ----------
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#020616';
  ctx.fillRect(0, 0, W, H);

  if (t < 3.0) {
    // SHOT 1 — hook: quick push-in on the poster
    renderPoster(pctx, t, 'hook', t);
    const s = 1.0 + 0.07 * easeOut(seg(t, 0, 3));
    drawRippled(ctx, posterC, 0, t, s, 1);
  } else if (t < 6.0) {
    // SHOT 2 — ripple, pull back, dissolve into the sea
    const lt = t - 3.0;
    const seaScale = lerp(1.18, 1.0, easeOut(seg(lt, 0, 3)));
    renderSea(sctx, t);
    ctx.save();
    ctx.translate(W / 2, H * 0.55); ctx.scale(seaScale, seaScale); ctx.translate(-W / 2, -H * 0.55);
    ctx.drawImage(seaC, 0, 0);
    ctx.restore();

    const posterAlpha = 1 - easeInOut(seg(lt, 0.5, 1.6));
    if (posterAlpha > 0) {
      renderPoster(pctx, t, 'hook', 3.0);
      const amp = 26 * easeOut(seg(lt, 0, 0.6)) + 30 * seg(lt, 0.6, 1.6);
      const ps = lerp(1.07, 0.86, easeInOut(seg(lt, 0, 1.6)));
      drawRippled(ctx, posterC, amp, t, ps, posterAlpha);
    }
    renderDrifters(ctx, t);

    // gentle fade toward the poster at the very end of the shot
    const toP = easeInOut(seg(t, 5.65, 6.0));
    if (toP > 0) {
      renderPoster(pctx, t, 'info', 0);
      drawRippled(ctx, posterC, 0, t, 1.06, toP * 0.75);
    }
  } else {
    // SHOT 3 — settle on the poster, info + CTA
    const lt = t - 6.0;
    renderPoster(pctx, t, 'info', lt);
    const s = lerp(1.06, 1.0, easeOut(seg(lt, 0, 1.2)));
    if (lt < 0.45) {
      // finish the crossfade from the sea
      renderSea(sctx, t);
      ctx.drawImage(seaC, 0, 0);
      drawRippled(ctx, posterC, 0, t, s, lerp(0.75, 1, easeOut(seg(lt, 0, 0.45))));
    } else {
      drawRippled(ctx, posterC, 0, t, s, 1);
    }
    renderDrifters(ctx, t);
  }

  // film grain-ish soft top/bottom shading for cinematic feel
  const sh = ctx.createLinearGradient(0, 0, 0, H);
  sh.addColorStop(0, 'rgba(0,0,0,0.25)');
  sh.addColorStop(0.12, 'rgba(0,0,0,0)');
  sh.addColorStop(0.88, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H);
};

window.ready = document.fonts.ready.then(async () => {
  await document.fonts.load('700 100px "Dancing Script"');
  await document.fonts.load('600 100px "Dancing Script"');
  await document.fonts.load('700 50px Montserrat');
  await document.fonts.load('600 50px Montserrat');
  await document.fonts.load('500 50px Montserrat');
  return true;
});
</script>
